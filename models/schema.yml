version: 2

sources:
  - name: raw  # Alias für das Dataset gz_raw_data
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found in each orders_id
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: id of order/purchase
            tests:
            - not_null
          - name: pdt_id
            description: id of product purchased
          - name: revenue
            description: revenue generated with the order
          - name: quantity
            description: quantities purchased
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"
      - name: product
        identifier: raw_gz_product
        description: products of Greenweez / we have one row per product_id displaying the price the product is sold at
        columns:
          - name: products_id
            description: id of the product
            tests:
            - unique
            - not_null
          - name: purchase_price
            description: price at which the product is sold
      - name: ship
        identifier: raw_gz_ship
        description: shipping details for Greenweez orders / we have one row per orders_id displaying its shipping details
        columns:
          - name: orders_id
            description: id of the order/purchase
            tests:
            - unique
            - not_null
          - name: shipping_fee
            description: fee to ship
          - name: logcost
            description: logistical cost
          - name: ship_cost
            description: cost of shipping
